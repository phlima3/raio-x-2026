name: Scraper (Scheduled Sync)

on:
  schedule:
    # Daily at 3am UTC: sync Câmara + Senado votes
    - cron: '0 3 * * *'
    # Weekly on Monday at 4am UTC: scrape candidate sites + process proposals with LLM
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'populate'
        type: choice
        options:
          - fix-migration
          - import-gemini
          - import-tse-historico
          - import-tse-financiamento
          - populate
          - presidenciaveis
          - daily
          - weekly
          - weekly-news
          - all

jobs:
  populate:
    name: Populate Real Data (One-shot)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'populate'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browsers
        working-directory: packages/scraper
        run: npx playwright install chromium --with-deps

      - name: Install scraper deps
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma CLI + schema)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (from API)
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Copy Prisma client into scraper
        run: |
          SRC=$(find packages/api/node_modules -path '*/.prisma/client/index.js' -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: Prisma client not generated in API"
            exit 1
          fi
          SRC_DIR="$(dirname "$SRC")"
          echo "Generated client: $SRC_DIR"
          # Em pnpm, @prisma/client é symlink para .pnpm store; .prisma/client precisa ficar adjacente
          find packages/scraper/node_modules -type d -name "client" -path "*/@prisma/client" | while read CLIENT_DIR; do
            PARENT="$(dirname "$(dirname "$CLIENT_DIR")")"  # sobe 2 níveis: .../node_modules
            TARGET="$PARENT/.prisma/client"
            mkdir -p "$TARGET"
            cp -r "$SRC_DIR/"* "$TARGET/"
            echo "Copied to $TARGET"
          done

      - name: Populate real data (link senators + scrape sites)
        working-directory: packages/scraper
        run: pnpm run populate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CAMARA_API_URL: https://dadosabertos.camara.leg.br/api/v2
          SENADO_API_URL: https://legis.senado.leg.br/dadosabertos
          SCRAPER_CONCURRENCY: '2'
        timeout-minutes: 90

  presidenciaveis:
    name: Sync Presidenciáveis (notícias → candidatos + propostas)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'presidenciaveis'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browsers
        working-directory: packages/scraper
        run: npx playwright install chromium --with-deps

      - name: Install scraper deps
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma CLI + schema)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Run pending migrations
        working-directory: packages/api
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Generate Prisma client (from API)
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Copy Prisma client into scraper
        run: |
          SRC=$(find packages/api/node_modules -path '*/.prisma/client/index.js' -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: Prisma client not generated in API"
            exit 1
          fi
          SRC_DIR="$(dirname "$SRC")"
          echo "Generated client: $SRC_DIR"
          # Em pnpm, @prisma/client é symlink para .pnpm store; .prisma/client precisa ficar adjacente
          find packages/scraper/node_modules -type d -name "client" -path "*/@prisma/client" | while read CLIENT_DIR; do
            PARENT="$(dirname "$(dirname "$CLIENT_DIR")")"  # sobe 2 níveis: .../node_modules
            TARGET="$PARENT/.prisma/client"
            mkdir -p "$TARGET"
            cp -r "$SRC_DIR/"* "$TARGET/"
            echo "Copied to $TARGET"
          done

      - name: Sync presidenciáveis (candidatos + propostas via notícias)
        working-directory: packages/scraper
        run: pnpm run sync:presidenciaveis
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPER_HEADLESS: 'true'
        timeout-minutes: 30

  daily-sync:
    name: Daily Sync (Câmara + Senado)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'daily' || github.event.inputs.job == 'all') || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
