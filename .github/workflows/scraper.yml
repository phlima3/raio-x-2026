name: Scraper (Scheduled Sync)

on:
  schedule:
    # Daily at 3am UTC: sync Câmara + Senado votes
    - cron: '0 3 * * *'
    # Weekly on Monday at 4am UTC: scrape candidate sites + process proposals with LLM
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'populate'
        type: choice
        options:
          - fix-migration
          - import-gemini
          - import-tse-historico
          - import-tse-financiamento
          - populate
          - daily
          - weekly
          - weekly-news
          - all

jobs:
  populate:
    name: Populate Real Data (One-shot)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'populate'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browsers
        working-directory: packages/scraper
        run: npx playwright install chromium --with-deps

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Populate real data (link senators + scrape sites)
        working-directory: packages/scraper
        run: pnpm run populate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CAMARA_API_URL: https://dadosabertos.camara.leg.br/api/v2
          SENADO_API_URL: https://legis.senado.leg.br/dadosabertos
          SCRAPER_CONCURRENCY: '2'
        timeout-minutes: 90

  daily-sync:
    name: Daily Sync (Câmara + Senado)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'daily' || github.event.inputs.job == 'all') || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Run daily sync
        working-directory: packages/scraper
        run: pnpm run sync:all
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAMARA_API_URL: https://dadosabertos.camara.leg.br/api/v2
          SENADO_API_URL: https://legis.senado.leg.br/dadosabertos
        timeout-minutes: 60

  weekly-proposals:
    name: Weekly Proposals (Sites + LLM)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'weekly' || github.event.inputs.job == 'all')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browsers
        working-directory: packages/scraper
        run: npx playwright install chromium --with-deps

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Scrape candidate sites + process proposals
        working-directory: packages/scraper
        run: pnpm run process:proposals
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_CONCURRENCY: '2'
        timeout-minutes: 60

  import-gemini:
    name: Import Gemini Research Data
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'import-gemini'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client (api)
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Import Gemini research data (includes Renan preflight fix)
        working-directory: packages/scraper
        run: pnpm run import:gemini
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        timeout-minutes: 10

  weekly-news:
    name: Weekly News (Gemini Search Grounding)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'weekly-news' || github.event.inputs.job == 'all')

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Run weekly news sync
        working-directory: packages/scraper
        run: pnpm run news:weekly
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        timeout-minutes: 30

  import-tse-historico:
    name: Import TSE histórico (bens 2018/2022)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'import-tse-historico'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Import TSE histórico (bens 2018/2022)
        working-directory: packages/scraper
        run: npx tsx src/jobs/importTseHistorico.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        timeout-minutes: 30

  import-tse-financiamento:
    name: Import TSE financiamento (receitas+despesas 2018/2022)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'import-tse-financiamento'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API deps (for Prisma)
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Install dependencies
        working-directory: packages/scraper
        run: pnpm install --frozen-lockfile

      - name: Import TSE financiamento (receitas+despesas 2018/2022)
        working-directory: packages/scraper
        run: npx tsx src/jobs/importTseFinanciamento.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        timeout-minutes: 30

  fix-migration:
    name: Fix Failed Migration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fix-migration'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API deps
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Resolve failed migration (mark as rolled-back)
        working-directory: packages/api
        run: pnpm prisma migrate resolve --rolled-back 20260326030000_add_unaccent
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Re-run all pending migrations
        working-directory: packages/api
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
