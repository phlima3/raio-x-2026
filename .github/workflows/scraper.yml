            exit 1
          fi
          SRC_DIR="$(dirname "$SRC")"
          echo "Generated client: $SRC_DIR"
          # Em pnpm, @prisma/client é symlink para .pnpm store; .prisma/client precisa ficar adjacente
          find packages/scraper/node_modules -type d -name "client" -path "*/@prisma/client" | while read CLIENT_DIR; do
            PARENT="$(dirname "$(dirname "$CLIENT_DIR")")"  # sobe 2 níveis: .../node_modules
            TARGET="$PARENT/.prisma/client"
            mkdir -p "$TARGET"
            cp -r "$SRC_DIR/"* "$TARGET/"
            echo "Copied to $TARGET"
          done

      - name: Import Gemini research data (includes Renan preflight fix)
        working-directory: packages/scraper
        run: pnpm run import:gemini
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        timeout-minutes: 10

  weekly-news:
