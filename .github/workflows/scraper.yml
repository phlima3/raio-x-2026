      - name: Generate Prisma client (from API)
        working-directory: packages/api
        run: pnpm prisma generate

      - name: Copy Prisma client into scraper
        run: |
          SRC=$(find packages/api/node_modules -path '*/.prisma/client/index.js' -type f | head -1)
          if [ -z "$SRC" ]; then
            echo "ERROR: Prisma client not generated in API"
            exit 1
          fi
          SRC_DIR="$(dirname "$SRC")"
          echo "Generated client: $SRC_DIR"
          # Em pnpm, @prisma/client é symlink para .pnpm store; .prisma/client precisa ficar adjacente
          find packages/scraper/node_modules -type d -name "client" -path "*/@prisma/client" | while read CLIENT_DIR; do
            PARENT="$(dirname "$(dirname "$CLIENT_DIR")")"  # sobe 2 níveis: .../node_modules
            TARGET="$PARENT/.prisma/client"
            mkdir -p "$TARGET"
            cp -r "$SRC_DIR/"* "$TARGET/"
            echo "Copied to $TARGET"
          done

      - name: Run daily sync
        working-directory: packages/scraper
        run: pnpm run sync:all
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CAMARA_API_URL: https://dadosabertos.camara.leg.br/api/v2
          SENADO_API_URL: https://legis.senado.leg.br/dadosabertos
        timeout-minutes: 60

  weekly-proposals:
