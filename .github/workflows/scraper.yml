          echo "Generated client: $SRC_DIR"
          # Em pnpm, @prisma/client é symlink para .pnpm store; .prisma/client precisa ficar adjacente
          find packages/scraper/node_modules -type d -name "client" -path "*/@prisma/client" | while read CLIENT_DIR; do
            PARENT="$(dirname "$(dirname "$CLIENT_DIR")")"  # sobe 2 níveis: .../node_modules
            TARGET="$PARENT/.prisma/client"
            mkdir -p "$TARGET"
            cp -r "$SRC_DIR/"* "$TARGET/"
            echo "Copied to $TARGET"
          done

      - name: Import TSE financiamento (receitas+despesas 2018/2022)
        working-directory: packages/scraper
        run: npx tsx src/jobs/importTseFinanciamento.ts
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        timeout-minutes: 30

  fix-migration:
    name: Fix Failed Migration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'fix-migration'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install API deps
        working-directory: packages/api
        run: pnpm install --frozen-lockfile

      - name: Resolve failed migration (mark as rolled-back)
        working-directory: packages/api
        run: pnpm prisma migrate resolve --rolled-back 20260326030000_add_unaccent
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Re-run all pending migrations
        working-directory: packages/api
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
