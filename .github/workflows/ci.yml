name: CI

on:
  # Agendamento desligado em 2026-08-29: a execução passou a ser local, pela
  # automation do Orca, com o transporte de browser (TSE_BROWSER_TRANSPORT=1).
  # `workflow_dispatch` fica de propósito — é o caminho de volta se o billing
  # do GitHub voltar; basta reintroduzir o bloco `schedule` que está no
  # histórico deste arquivo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raiox2026_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raiox2026_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raiox2026_test
      CACHE_DISABLED: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - name: Apply additive migrations
        run: pnpm --filter @raiox/api exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test:unit
      - name: PostgreSQL integration tests
        run: pnpm test:integration
      - name: Typecheck workspace
        run: pnpm typecheck
      # As páginas de candidato, tema, UF e comparação são pré-renderizadas e
      # consultam a API durante `next build`. Sem ela no ar o build falha em
      # `generateStaticParams`, que é como a indexação SEO passou despercebida:
      # o CI nunca chegou a exercitá-la. O banco está vazio, então o build
      # valida a fiação de SSG, não o conteúdo.
      - name: Start API for the web build
        working-directory: packages/api
        run: |
          ./node_modules/.bin/tsx src/index.ts &
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3001/health > /dev/null; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in 60s" >&2
          exit 1
      - name: Build workspace
        run: pnpm build
