name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, typecheck and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: raiox2026_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d raiox2026_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/raiox2026_test
      CACHE_DISABLED: 'true'
      NEXT_PUBLIC_API_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - name: Apply additive migrations
        run: pnpm --filter @raiox/api exec prisma migrate deploy
      - name: Unit tests
        run: pnpm test:unit
      - name: PostgreSQL integration tests
        run: pnpm test:integration
      - name: Typecheck workspace
        run: pnpm typecheck
      - name: Build workspace
        run: pnpm build
