name: Sync TSE Official Data

on:
  # Agendamento desligado em 2026-08-29: a execução passou a ser local, pela
  # automation do Orca, com o transporte de browser (TSE_BROWSER_TRANSPORT=1).
  # `workflow_dispatch` fica de propósito — é o caminho de volta se o billing
  # do GitHub voltar; basta reintroduzir o bloco `schedule` que está no
  # histórico deste arquivo.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Parse and validate without changing domain records
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: sync-tse-official
  cancel-in-progress: false

jobs:
  candidacies:
    name: Sync canonical candidacies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
      TSE_API_URL: https://dadosabertos.tse.jus.br
      WEB_REVALIDATION_URL: https://raio-x-2026.com.br/api/revalidate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - uses: ./.github/actions/setup-veloz-db-tunnel
        with:
          api-key: ${{ secrets.VELOZ_API_KEY }}
      - name: Apply database migrations before the sync
        run: pnpm --filter @raiox/api exec prisma migrate deploy
      - name: Sync canonical candidacies at workflow start
        run: pnpm --filter @raiox/scraper run sync:tse ${{ inputs.dry_run && '-- --dry-run' || '' }}

  supplemental:
    name: Sync complementary official datasets
    needs: candidacies
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      REDIS_URL: ${{ secrets.PROD_REDIS_URL }}
      REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
      TSE_API_URL: https://dadosabertos.tse.jus.br
      WEB_REVALIDATION_URL: https://raio-x-2026.com.br/api/revalidate
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - uses: ./.github/actions/setup-veloz-db-tunnel
        with:
          api-key: ${{ secrets.VELOZ_API_KEY }}
      - name: Sync complementary official datasets
        run: pnpm --filter @raiox/scraper run sync:tse:supplemental ${{ inputs.dry_run && '-- --dry-run' || '' }}
      # Prestação de contas da chapa presidencial. Muda ao longo da campanha,
      # diferente do documento de registro, por isso acompanha o sync diário.
      - name: Sync campaign financing
        if: ${{ !cancelled() }}
        run: pnpm --filter @raiox/scraper run sync:financiamento ${{ inputs.dry_run && '-- --dry-run' || '' }}
