name: Enrich Candidate Sites

on:
  # Agendamento desligado em 2026-08-29: a execução passou a ser local, pela
  # automation do Orca, com o transporte de browser (TSE_BROWSER_TRANSPORT=1).
  # `workflow_dispatch` fica de propósito — é o caminho de volta se o billing
  # do GitHub voltar; basta reintroduzir o bloco `schedule` que está no
  # histórico deste arquivo.
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: sync-candidate-sites
  cancel-in-progress: false

jobs:
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SCRAPER_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - uses: ./.github/actions/setup-veloz-db-tunnel
        with:
          api-key: ${{ secrets.VELOZ_API_KEY }}
      - name: Install Chromium
        run: pnpm --filter @raiox/scraper exec playwright install chromium --with-deps
      - name: Scrape candidate sites
        run: pnpm --filter @raiox/scraper run process:proposals
