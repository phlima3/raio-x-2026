name: Sync TSE Official Documents

on:
  schedule:
    # Programa de governo é protocolado no registro e não muda depois; diário
    # só reconfirmava PDF idêntico, que o dedupe por SHA-256 já descartava.
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Download and extract without persisting documents
        type: boolean
        default: false
      election_id:
        description: idEleicao do DivulgaCandContas (padrão 20322002026)
        type: string
        required: false

permissions:
  contents: read
concurrency:
  group: sync-tse-documents
  cancel-in-progress: false

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      TSE_API_URL: https://dadosabertos.tse.jus.br
      TSE_DIVULGACAND_ELECTION_ID: ${{ inputs.election_id || '20322002026' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pipeline
      - uses: ./.github/actions/setup-veloz-db-tunnel
        with:
          api-key: ${{ secrets.VELOZ_API_KEY }}
      # Caminho por candidatura: baixa só a proposta de governo de quem disputa
      # a Presidência, sem depender do pacote de ~195 MB do catálogo.
      - name: Attach presidential candidacy documents (DivulgaCandContas)
        run: pnpm --filter @raiox/scraper run sync:divulgacand ${{ inputs.dry_run && '-- --dry-run' || '' }}
      # O catálogo cobre os demais cargos; roda mesmo se o passo acima falhar,
      # para não perder a varredura ampla por causa de uma candidatura.
      - name: Sync campaign documents
        if: ${{ !cancelled() }}
        run: pnpm --filter @raiox/scraper run sync:documents ${{ inputs.dry_run && '-- --dry-run' || '' }}
